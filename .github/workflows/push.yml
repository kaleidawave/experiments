name: publish-external-assets
run-name: Build assets for (external) projects

on: push

jobs:
  build-and-upload-binaries:
    permissions: write-all

    runs-on: x86_64-unknown-linux

    env:
      PROFILE: dev
      OUT: target/debug
      GH_RELEASE: assets

    steps:
      - uses: actions/checkout@v4
        with:
          repository: taiki-e/cargo-fuzz
          ref: default-target

      - uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --profile ${{ env.PROFILE }}

      - name: Publish binary
        shell: bash
        env: { "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          FROM='${{ env.OUT }}/cargo-fuzz'
          TO='cargo-fuzz-x86_64-unknown-linux'
          # LABEL="cargo-fuzz-$TO"
          LABEL="$TO"
          mv $FROM $TO
          gh release upload $GH_RELEASE "$TO#$LABEL" --clobber

  build-and-upload-languages:
    permissions: write-all

    runs-on: x86_64-unknown-linux

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repository:
          - https://github.com/tree-sitter/tree-sitter-rust
          - https://github.com/tree-sitter/tree-sitter-go
          - https://github.com/tree-sitter/tree-sitter-regex
          - https://github.com/tree-sitter/tree-sitter-typescript
          - https://github.com/tree-sitter-grammars/tree-sitter-zig
          - https://github.com/tree-sitter-grammars/tree-sitter-yaml
          - https://github.com/tree-sitter-grammars/tree-sitter-markdown
          - https://github.com/DerekStride/tree-sitter-sql

    steps:
      - name: clone, build and publish
        env: 
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_RELEASE: assets
        run: |
          url='${{ matrix.repository }}'
          # get the part after the last '-' in the URL
          language=${url##*-}

          git clone "$url.git" .
          clang -dynamiclib -o "libtree-sitter-$language.dylib" parser.c scanner.c -Isrc -fPIC "-Wl,-exported_symbol,_tree_sitter_$language"

          gh release upload $GH_RELEASE "libtree-sitter-$language.dylib" --clobber
