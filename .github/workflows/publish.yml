name: Build assets for projects

on:
  push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        library: [specification-tool]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Run check
        run: cargo check
        working-directory: ${{ matrix.library }}

      - name: Run test
        run: cargo test
        working-directory: ${{ matrix.library }}

  publish-assets:
    permissions: write-all
    needs: check

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        binary: [specification-tool]
        include:
        - os: windows-latest
          platform-name: x86_64-pc-windows
          executable-extension: ".exe"
        - os: ubuntu-latest
          platform-name: x86_64-unknown-linux
        - binary: specification-tool
          name: spectra

    runs-on: ${{ matrix.os }}

    env:
      LEVEL: debug
      GH_RELEASE: assets

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set variables
        id: information
        run: |
          echo "GITHUB_RUN_DATE=$(TZ="Europe/London" date +"%Y-%m-%d %T")" >> "$GITHUB_OUTPUT"
          echo "GIT_LAST_COMMIT=$(git log -n 1 --format="%H")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build ${{ matrix.name }} binary
        working-directory: ${{ matrix.binary }}
        run: cargo build
        env:
          GITHUB_RUN_DATE: ${{ steps.information.outputs.GITHUB_RUN_DATE }}
          GIT_LAST_COMMIT: ${{ steps.information.outputs.GIT_LAST_COMMIT }}
        
      - name: Publish ${{ matrix.name }} binary
        working-directory: ${{ matrix.binary }}
        run: gh release upload $GH_RELEASE ./target/$LEVEL/${{ matrix.name }}${{ matrix.executable-extension }}#${{ matrix.name }}-${{ matrix.platform-name }}${{ matrix.executable-extension }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    permissions: write-all
    needs: check

    strategy:
      matrix:
        library: [specification-tool]

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crates publish
        uses: kaleidawave/crates-release-gh-action@improvements
        id: release
        with:
          version: patch
          crates-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          working-directory: ${{ matrix.library }}

      - name: Push updated Cargo.toml
        run: |
          git status
          echo "::debug::${{ steps.checkout.outputs.ref }}"
          git add .
          git commit -m "Release: ${{ steps.release.outputs.new-versions-description }}"
          # git push --tags origin ${{ steps.checkout.outputs.ref }}