name: Build assets for projects

on:
  push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [general-parser]

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: oven-sh/setup-bun@v2
    - uses: kaleidawave/release-downloader@main
      with:
        items: kaleidawave/experiments@assets[spectra]

    - name: Check
      run: cargo check
      working-directory: ${{ matrix.project }}

    - name: Test
      continue-on-error: true # TODO temp
      run: cargo test
      working-directory: ${{ matrix.project }}

    - name: Test (JavaScript)
      continue-on-error: true # TODO temp
      run: bun run test
      working-directory: ${{ matrix.project }}/javascript

    - name: Lint
      run: cargo clippy
      continue-on-error: true # TODO temp
      working-directory: ${{ matrix.project }}

  publish-assets:
    needs: check

    permissions: write-all

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        binary: [general-parser~parse]
        include:
        - os: windows-latest
          platform-name: x86_64-pc-windows
          executable-extension: ".exe"
        - os: ubuntu-latest
          platform-name: x86_64-unknown-linux

    runs-on: ${{ matrix.os }}

    env:
      LEVEL: debug
      GH_RELEASE: assets

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set variables
        id: information
        run: |
          echo "GITHUB_RUN_DATE=$(TZ="Europe/London" date +"%Y-%m-%d %T")" >> "$GITHUB_OUTPUT"
          echo "GIT_LAST_COMMIT=$(git log -n 1 --format="%H")" >> "$GITHUB_OUTPUT"

          IFS='~' read -r binary example <<< '${{ matrix.binary }}'
          echo "WORKING_DIRECTORY=$binary" >> "$GITHUB_OUTPUT"
          if [ -n "$example" ]; then
            echo "BUILD_SPECIFIER=--example $example" >> "$GITHUB_OUTPUT"
            echo "ASSET_PATH=examples/$example" >> "$GITHUB_OUTPUT"
            echo "ASSET_NAME=$example" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD_SPECIFIER=" >> "$GITHUB_OUTPUT"
            echo "ASSET_PATH=$binary" >> "$GITHUB_OUTPUT"
            echo "ASSET_NAME=$binary" >> "$GITHUB_OUTPUT"
          fi

        shell: bash

      - name: Build binary
        working-directory: ${{ steps.information.outputs.WORKING_DIRECTORY }}
        run: cargo build ${{ steps.information.outputs.BUILD_SPECIFIER }}
        env:
          GITHUB_RUN_DATE: ${{ steps.information.outputs.GITHUB_RUN_DATE }}
          GIT_LAST_COMMIT: ${{ steps.information.outputs.GIT_LAST_COMMIT }}
        
      - name: Publish binary
        working-directory: ${{ steps.information.outputs.WORKING_DIRECTORY }}
        run: |
          FROM="./target/$LEVEL/${{ steps.information.outputs.ASSET_PATH }}${{ matrix.executable-extension }}"
          TO="${{ steps.information.outputs.ASSET_NAME }}-${{ matrix.platform-name }}${{ matrix.executable-extension }}"

          gh release upload $GH_RELEASE "$FROM#$TO" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    needs: check

    permissions: write-all

    strategy:
      matrix:
        library: [general-parser]
        
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crates publish
        uses: kaleidawave/crates-release-gh-action@improvements
        id: release
        with:
          version: patch
          crates-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          working-directory: ${{ matrix.library }}

      - name: Push updated Cargo.toml
        run: |
          git status
          git add .
          git commit -m "Release: ${{ steps.release.outputs.new-versions-description }}"
          git push origin ${{ steps.checkout.outputs.ref }}

  publish-javascript:
    needs: check

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Publish package
        run: npx jsr publish
        working-directory: general-parser/javascript
