name: check-build-assets-and-publish
run-name: Build assets for projects

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy: { matrix: { project: [frame-protocol] } }

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Check
      run: cargo check
      working-directory: ${{ matrix.project }}

    - name: Test
      run: cargo test
      working-directory: ${{ matrix.project }}

    - name: Lint
      run: cargo clippy
      working-directory: ${{ matrix.project }}

  publish-crates:
    needs: check

    permissions:
      contents: write
      id-token: write

    strategy: { matrix: { project: [frame-protocol] } }
        
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: kaleidawave/crates-release-gh-action@improvements
        id: release
        with:
          working-directory: ${{ matrix.project }}
          crates-token: ${{ steps.auth.outputs.token }}
          version: patch
      
      - name: Update JavaScript library
        working-directory: ${{ matrix.project }}/javascript
        run: npx jsr publish

      - name: Push updated Cargo.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Release: ${{ steps.release.outputs.new-versions-description }}"
          git push --tags origin ${{ steps.checkout.outputs.ref }}