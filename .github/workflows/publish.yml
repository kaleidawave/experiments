name: Check, build assets and publish project

on:
  push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [json-builder-macro]

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Check
      run: cargo check
      working-directory: ${{ matrix.project }}

    - name: Test
      run: cargo test
      working-directory: ${{ matrix.project }}

    - name: Lint
      continue-on-error: true
      run: cargo clippy
      working-directory: ${{ matrix.project }}

  publish-crates:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - id: checkout
      uses: actions/checkout@v4

    - id: auth
      uses: rust-lang/crates-io-auth-action@v1

    - id: release
      name: Crates publish
      uses: kaleidawave/crates-release-gh-action@improvements
      with:
        # TODO specify version $ {{  github.event.inputs.version }}
        version: patch 
        crates-token: ${{ steps.auth.outputs.token }}
        working-directory: json-builder-macro

    - name: Push updated Cargo.toml
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Release: ${{ steps.release.outputs.new-version }}"
        git push origin ${{ steps.checkout.outputs.ref }}

        echo '${{ steps.release.outputs.new-versions-description }}'

        # git tag "release/${{ steps.release.outputs.new-version }}"
        # git push --tags origin ${{ steps.checkout.outputs.ref }}

    - name: Discord
      uses: rjstone/discord-webhook-notify@main
      with:
        severity: info
        text: "Released version ${{ steps.release.outputs.new-versions-description }}"
        webhookUrl: ${{ secrets.DISCORD_WEBHOOK_ENDPOINT }}