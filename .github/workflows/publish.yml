name: Build and publish libraries and assets

on:
  push

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [mashrl]

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Check
      run: cargo check
      working-directory: ${{ matrix.project }}

    - name: Test
      run: cargo test
      working-directory: ${{ matrix.project }}

    - name: Lint
      run: cargo clippy
      working-directory: ${{ matrix.project }}

  publish-libraries:
    needs: check

    permissions: write-all

    strategy:
      matrix:
        library: [mashrl]

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: kaleidawave/crates-release-gh-action@improvements
        id: update-version
        with:
          crates-token: ${{ steps.auth.outputs.token }}
          version: patch
          working-directory: ${{ matrix.library }}

      - name: Push updated Cargo.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Release: ${{ steps.update-version.outputs.new-versions-description }}"
          git push origin ${{ steps.checkout.outputs.ref }}