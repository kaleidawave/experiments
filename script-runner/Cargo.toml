[package]
name = "script-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
simple-json-parser = { git = "https://github.com/kaleidawave/simple-json-parser.git", branch = "improvements", version = "0.0.5" }
simple-toml-parser = { git = "https://github.com/kaleidawave/simple-toml-parser.git", branch = "improvements" }

[[bin]]
name = "script-runner"
path = "./main.rs"

[package.metadata.commands]
echo = "./target/debug/examples/echo.exe hello world"
